<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Something Went Wrong</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fdf1f1;
            color: #333;
            text-align: center;
            padding: 50px;
        }
        .error-container {
            max-width: 500px;
            margin: auto;
            background: #fff0f0;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 10px #e3caca;
        }
        h1 {
            font-size: 48px;
            margin-bottom: 10px;
            color: #d9534f;
        }
        p {
            font-size: 18px;
            margin-bottom: 20px;
        }
        button {
            background-color: #d9534f;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background-color: #c9302c;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>500</h1>
        <p>Oops! Something went wrong on our side.</p>
        <button onclick="goBack()">Go Back</button>
    </div>

    <script>
        function goBack() {
            window.history.back();
        }
    </script>
</body>
</html>
