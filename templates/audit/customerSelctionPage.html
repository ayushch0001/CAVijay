{% extends 'templates/base/base.html' %}

{% block title %}Audit Report{% endblock %}

{% block content %}
    <h1>Audit Report</h1>
    <form id="customerForm" style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
        {% csrf_token %}
        <select id="clusterSelect" style="min-width: 200px;">
            <option value="">Select Cluster</option>
            {% for cluster in clusters %}
                <option value="{{ cluster.id }}">{{ cluster.name }}</option>
            {% endfor %}
        </select>
        <div style="position: relative;">
            <input type="text" id="customerSearch" placeholder="Search Customer" autocomplete="off" disabled style="min-width: 200px;">
            <div id="customerSuggestions" class="suggestions" style="display: none; position: absolute; background: white; border: 1px solid #ddd; z-index: 1000; width: 100%;"></div>
        </div>
        <select id="auditSelect" style="display: none; min-width: 200px;">
            <option value="">Select Audit</option>
        </select>
        <button type="button" id="fetchAudit" style="min-width: 120px; flex-shrink: 0;">Fetch Audit</button>
    </form>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#clusterSelect').on('change', function() {
                const clusterId = $(this).val();
                if (clusterId) {
                    $('#customerSearch').prop('disabled', false);
                } else {
                    $('#customerSearch').prop('disabled', true);
                    $('#customerSearch').val('');
                    $('#customerSuggestions').hide();
                    $('#auditSelect').hide().empty();
                }
            });

            $('#customerSearch').on('input', function() {
                const query = $(this).val();
                const clusterId = $('#clusterSelect').val();
                if (query.length >= 2 && clusterId) {
                    $.ajax({
                        url: '/search-customer/',
                        method: 'GET',
                        data: { 
                            query: query,
                            cluster_id: clusterId 
                        },
                        success: function(response) {
                            const suggestions = $('#customerSuggestions');
                            suggestions.empty();
                            response.customers.forEach(customer => {
                                suggestions.append(`<div data-id="${customer.id}" style="padding: 8px; cursor: pointer; border-bottom: 1px solid #eee;">${customer.nameOfOrganization}</div>`);
                            });
                            suggestions.show();
                        }
                    });
                } else {
                    $('#customerSuggestions').hide();
                }
            });

            $('#customerSuggestions').on('click', 'div', function() {
                const customerId = $(this).data('id');
                const customerName = $(this).text();
                $('#customerSearch').val(customerName);
                $('#customerSuggestions').hide();

                $.ajax({
                    url: '/fetch-audits/',
                    method: 'GET',
                    data: { customer_id: customerId },
                    success: function(response) {
                        const auditSelect = $('#auditSelect');
                        auditSelect.empty().append('<option value="">Select Audit</option>');
                        response.audits.forEach(audit => {
                            auditSelect.append(`<option value="${audit.id}">${audit.yearStart} - ${audit.yearEnd}</option>`);
                        });
                        auditSelect.show();
                    }
                });
            });

            $('#fetchAudit').on('click', function() {
                const auditId = $('#auditSelect').val();
                if (auditId) {
                    window.location.href = `/report/?audit_id=${auditId}`;
                }
            });
        });
    </script>

    <style>
        /* Additional CSS for better stability */
        #customerForm {
            margin: 20px 0;
        }
        
        #customerForm select, 
        #customerForm input {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            height: 38px; /* Consistent height */
            box-sizing: border-box;
        }
        
        #fetchAudit {
            padding: 8px 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            height: 38px; /* Match other inputs */
        }
        
        #fetchAudit:hover {
            background-color: #0069d9;
        }
        
        .suggestions div:hover {
            background-color: #f5f5f5;
        }
    </style>
{% endblock %}
